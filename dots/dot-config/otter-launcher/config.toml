[general]
default_module = "app" # module to run when no prefix is matched
empty_module = "app"# run with an empty prompt
exec_cmd = "zsh -c" # exec command of your shell
vi_mode = false # set true to use vi keybinds, false emacs keybinds
esc_to_abort = true # press esc to quit, only effective in emacs mode
cheatsheet_entry = "?" # when prompted, will show a list of configured modules
cheatsheet_viewer = "less -R; clear" # command to show cheatsheet; through piping stdout
clear_screen_after_execution = false
loop_mode = false # don't quit after executing a module, useful with scratchpads; stderr is hidden in loop mode
external_editor = "nvim" # if set, press ctrl+x ctrl+ee (or v in vi normal mode) to edit prompt in the specified program
delay_startup = 0 # sometimes the otter runs too fast even before the terminal window is ready; this slows it down by milliseconds; useful when chafa image is skewed
# if set, will run after module execution; for example, calling swaymsg to adjust window size
callback = ""


# ANSI color codes are allowed. However, \x1b should be replaced with \u001B, because the rust toml crate cannot read \x as an escaped character
[interface]
# use three quotes to write longer codes
header = """
 \u001B[34;1m  \u001B[0m$USER@$(printf $HOSTNAME)\u001B[0m$(printf '\u001B[999C\u001B[14D')\u001B[31m\u001B[0m $(cat /proc/loadavg | awk 'FNR ==1 {print $1}') \u001B[33m󰍛\u001B[0m $(free -h | awk 'FNR == 2 {print $3}' | sed 's/i//')
    """
header_cmd = "" # run a command and print stdout above the header
header_cmd_trimmed_lines = 0 # remove trailing lines from header_cmd output, lest programs appending excessive lines
place_holder = "exec" # texts to show at the input field
suggestion_mode = "list" # available options: list, hint
# add a line between input field and suggestion list; only effective in list mode
separator = """
$( \
    text="    modules"; \
    printf "\u001B[0;90m$text \
    $(printf -v line '%*s' \"$(( COLUMNS - $(printf "$text" | wc -m) - 3 ))\" ''; printf '%s' \"${line// /─}\")" \
)"""
footer = "" # add a line after suggestion list
suggestion_lines = 7 # 0 to disable suggestions and tab completion
list_prefix = "    "
selection_prefix = "  \u001B[31;1m▌ "
prefix_padding = 3 # format prefixes to have a uniformed width
default_module_message = "    \u001B[33mlaunch\u001B[0m an app" # shown when the default module is in use
empty_module_message = "" # shown when the empty module is in use
customized_list_order = false # false to list suggestions/hints alphabetically; true to list them as per the configured order in the below [[modules]] section
indicator_with_arg_module = "" # the sign showing whether a module should run with an argument
indicator_no_arg_module = ""
prefix_color = "\u001B[33m" # below color options affect all modules; per-module coloring can be configured using ansi codes individually
description_color = "\u001B[39m"
place_holder_color = "\u001B[30m"
hint_color = "\u001B[30m" # suggestion color in hint mode
cursor_shape = 0 # cursor shape: 0 -> default; 1,2 -> block; 3,4 -> underline; 5,6 -> beam; odd blinks; even static

# move the interface rightward or downward
move_interface_right = 0
move_interface_down = 0


# overlay is a floating layer that can be printed with stdout and moved around; useful for integrating chafa images; check docs in repo for example usage
[overlay]
# run a command and print stdout on the overlay layer
overlay_cmd = ""
# remove trailing lines from overlay_cmd output
overlay_trimmed_lines = 0
# set overlay size; 0 to be auto; 1 is one line, 2 two lines, etc; kitty & sixel image size can be determined automatically; others should be set mannually; try modify this whenever you meet issues releated to image height
overlay_height = 0
# move the overlay layer around for theming
move_overlay_right = 0
move_overlay_down = 0


[[modules]]
description = "power menu (fzf)"
prefix = "po"
cmd = """
function power {
if [[ -n $1 ]]; then
case $1 in
"logout") session=`loginctl session-status | head -n 1 | awk '{print $1}'`; loginctl terminate-session $session ;;
"suspend") systemctl suspend ;;
"hibernate") systemctl hibernate ;;
"reboot") systemctl reboot ;;
"shutdown") systemctl poweroff ;;
esac fi }
power $(echo -e 'reboot\nshutdown\nlogout\nsuspend\nhibernate' | fzf --info-command 'printf " power menu ($FZF_POS/$FZF_TOTAL_COUNT)"' --cycle --gutter " " --pointer " ▌" --color "bg+:-1,pointer:1,info:8,separator:8,scrollbar:0" --prompt '  ' | tail -1)
"""

[[modules]]
description = "programs"
prefix = "app"
cmd = """
niri msg action set-column-width "50%"
niri msg action set-window-height "50%"
niri msg action center-window
fsel --no-exec
"""

[[modules]]
description = "manage bluetooth"
prefix = "bl"
cmd = """
niri msg action set-column-width "50%"
niri msg action set-window-height "50%"
niri msg action center-window
bluetui
"""

[[modules]]
description = "search nix packages"
prefix = "npac"
cmd = "xdg-open \"https://search.nixos.org/packages?channel=unstable&query={}\""
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "search nix options"
prefix = "nopt"
cmd = "xdg-open \"https://search.nixos.org/options?channel=unstable&query={}\""
with_argument = true
url_encode = true
unbind_proc = true

